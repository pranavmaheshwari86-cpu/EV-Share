version: '3.8'

services:
  web:
    build: .
    container_name: evshare_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=evshare-production-deployment-secret-key-change-in-prod
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - MONGODB_URI=mongodb://mongo:27017/ev_share
      - MONGODB_DATABASE=ev_share
      - MAP_TILE_URL=https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png
      - MAP_TILE_ATTRIBUTION=&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>
      - MAP_TILE_SUBDOMAINS=abcd
      - MAP_TILE_MAX_ZOOM=19
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: evshare_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
    driver: local
