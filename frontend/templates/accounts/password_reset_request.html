{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <div class="p-4 p-md-5 bg-white rounded-4 shadow-sm border text-center">
    <h2 class="h3 fw-semibold mb-2">Reset Password</h2>
    <p class="small text-muted mb-4">Enter your registered email address to receive password recovery instructions.</p>

    <form method="POST" action="{% url 'accounts:password_reset' %}">
      {% csrf_token %}
      <div class="mb-3 text-start">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" name="email" id="email" class="form-control" required placeholder="name@domain.com">
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Send Reset Instructions</button>
      <div class="small">
        <a href="{% url 'accounts:login' %}" class="text-decoration-none text-muted">← Back to Sign In</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
