{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <div class="p-4 p-md-5 bg-white rounded-4 shadow-sm border">
    <div class="text-center mb-4">
      <h2 class="h3 fw-semibold">Sign In to EV Share</h2>
      <p class="small text-muted">Access your bookings, listings, and garage profile.</p>
    </div>

    <form method="POST" action="{% url 'accounts:login' %}{% if next %}?next={{ next }}{% endif %}">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

      <div class="mb-3">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" name="email" id="email" class="form-control" required placeholder="name@domain.com" value="{{ email|default:'' }}" autofocus>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center">
          <label class="form-label" for="password">Password</label>
          <a href="{% url 'accounts:password_reset' %}" class="small text-muted text-decoration-none">Forgot?</a>
        </div>
        <input type="password" name="password" id="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Sign In</button>

      <div class="text-center small text-muted">
        Don't have an account yet? <a href="{% url 'accounts:register' %}" class="text-decoration-none fw-medium text-primary">Create one</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
