{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <div class="p-4 p-md-5 bg-white rounded-4 shadow-sm border text-center">
    <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3 bg-light" style="width: 56px; height: 56px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0071E3" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
    </div>
    <h2 class="h4 fw-semibold mb-2">Check Your Email</h2>
    <p class="small text-muted mb-4">If an active account exists for <strong>{{ email }}</strong>, an account recovery link has been dispatched.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-secondary w-100">Return to Sign In</a>
  </div>
</div>
{% endblock %}
